<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">MCP Portico connects MCP-compatible AI applications to authorized backend systems</title>
  <desc id="desc">MCP-compatible AI applications, including coding assistants, support agents, workflow agents, BI agents, voice agents, and custom applications, connect to MCP Portico, which connects to one or more authorized backend systems.</desc>
  <defs>
    <linearGradient id="porticoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4cf"/>
      <stop offset="1" stop-color="#ffe29a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4f7cff"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2eaa68"/>
    </marker>
    <style>
      .title { font: 700 25px Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 15px Inter, Segoe UI, Arial, sans-serif; fill: #667085; }
      .cardTitle { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #172033; }
      .cardText { font: 500 15px Inter, Segoe UI, Arial, sans-serif; fill: #475467; }
      .small { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #667085; }
      .pill { font: 700 14px Inter, Segoe UI, Arial, sans-serif; fill: #344054; }
    </style>
  </defs>

  <rect width="1400" height="560" rx="28" fill="#f8fafc"/>
  <text x="700" y="55" text-anchor="middle" class="title">One MCP front door for every AI application</text>
  <text x="700" y="82" text-anchor="middle" class="subtitle">MCP-compatible AI applications use policy-controlled APIs through MCP Portico</text>

  <!-- AI applications block -->
  <rect x="55" y="145" width="380" height="330" rx="22" fill="#eef4ff" stroke="#4f7cff" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="105" cy="195" r="22" fill="#4f7cff"/>
  <path d="M105 173 C107 184 113 189 124 191 C113 193 107 198 105 209 C103 198 97 193 86 191 C97 189 103 184 105 173 Z" fill="#ffffff"/>
  <text x="150" y="201" class="cardTitle">AI Applications</text>
  <text x="80" y="246" class="cardText">Any MCP-compatible AI application,</text>
  <text x="80" y="268" class="cardText">regardless of model or vendor</text>
  <text x="80" y="298" class="small">Clients include:</text>
  <rect x="80" y="314" width="150" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="155" y="336" text-anchor="middle" class="pill">Coding assistants</text>
  <rect x="250" y="314" width="140" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="320" y="336" text-anchor="middle" class="pill">Support agents</text>
  <rect x="80" y="358" width="150" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="155" y="380" text-anchor="middle" class="pill">Workflow agents</text>
  <rect x="250" y="358" width="90" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="295" y="380" text-anchor="middle" class="pill">BI agents</text>
  <rect x="80" y="402" width="120" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="140" y="424" text-anchor="middle" class="pill">Voice agents</text>
  <rect x="250" y="402" width="110" height="34" rx="17" fill="#ffffff" stroke="#c9d7ff"/>
  <text x="305" y="424" text-anchor="middle" class="pill">Custom apps</text>
  <text x="80" y="455" class="small">Connect over MCP</text>

  <!-- MCP Portico block -->
  <rect x="525" y="125" width="350" height="350" rx="22" fill="url(#porticoGradient)" stroke="#d99a00" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="575" cy="185" r="25" fill="#172033"/>
  <path d="M563 193 L563 178 L569 172 L581 172 L587 178 L587 193 M569 193 L569 181 L581 181 L581 193" fill="none" stroke="#ffffff" stroke-width="3"/>
  <text x="620" y="193" class="cardTitle">MCP Portico</text>
  <text x="700" y="237" text-anchor="middle" class="cardText">The security and policy boundary</text>
  <rect x="580" y="270" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.72"/>
  <text x="700" y="297" text-anchor="middle" class="pill">Catalog-controlled access</text>
  <rect x="580" y="325" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.72"/>
  <text x="700" y="352" text-anchor="middle" class="pill">Tenant and auth isolation</text>
  <rect x="580" y="380" width="240" height="42" rx="21" fill="#ffffff" fill-opacity="0.72"/>
  <text x="700" y="407" text-anchor="middle" class="pill">One deployment, many APIs</text>
  <text x="700" y="452" text-anchor="middle" class="small">No model, vendor, or UI dependency</text>

  <!-- Backend systems block -->
  <rect x="995" y="145" width="350" height="330" rx="22" fill="#edf9f2" stroke="#2eaa68" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="1045" cy="195" r="22" fill="#2eaa68"/>
  <path d="M1034 188 L1056 188 L1056 202 L1034 202 Z M1034 180 L1056 180 L1056 185 L1034 185 Z M1034 205 L1056 205 L1056 210 L1034 210 Z" fill="#ffffff"/>
  <text x="1080" y="203" class="cardTitle">Backend Systems</text>
  <text x="1025" y="248" class="cardText">Any approved HTTP API:</text>
  <rect x="1025" y="270" width="108" height="38" rx="19" fill="#ffffff" stroke="#bde8cf"/>
  <text x="1079" y="294" text-anchor="middle" class="pill">API 1</text>
  <rect x="1147" y="270" width="108" height="38" rx="19" fill="#ffffff" stroke="#bde8cf"/>
  <text x="1201" y="294" text-anchor="middle" class="pill">API 2</text>
  <rect x="1025" y="322" width="178" height="38" rx="19" fill="#ffffff" stroke="#bde8cf"/>
  <text x="1114" y="346" text-anchor="middle" class="pill">... API N</text>
  <text x="1025" y="455" class="small">Connect through HTTPS</text>

  <!-- Connections -->
  <line x1="440" y1="295" x2="515" y2="295" stroke="#4f7cff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="515" y1="345" x2="440" y2="345" stroke="#4f7cff" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="478" y="278" text-anchor="middle" class="small">MCP</text>
  <text x="478" y="370" text-anchor="middle" class="small">responses</text>

  <line x1="885" y1="295" x2="985" y2="295" stroke="#2eaa68" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="985" y1="345" x2="885" y2="345" stroke="#2eaa68" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <text x="935" y="278" text-anchor="middle" class="small">authorized calls</text>
  <text x="935" y="370" text-anchor="middle" class="small">API responses</text>

  <text x="700" y="515" text-anchor="middle" class="subtitle">AI applications never connect directly to unregistered backend origins</text>
</svg>