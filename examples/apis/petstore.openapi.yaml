openapi: 3.0.3
info:
  title: Petstore Lite API
  description: >-
    A small, realistic public API for managing pets. Pets routes are secured
    with bearer tokens; the health endpoint is public. This file is the
    walkthrough input for `mcp-portico catalog import`.
  version: 1.0.0
servers:
  - url: https://petstore.example.com/v1
tags:
  - name: pets
    description: Pet operations
  - name: health
    description: Service health
paths:
  /pets:
    get:
      operationId: pets.list
      summary: List pets
      description: Returns pets, optionally filtered by tag and limited in count.
      tags: [pets]
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of pets to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          required: false
          description: Only return pets with this tag.
          schema:
            type: string
      responses:
        '200':
          description: A list of pets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        default:
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      operationId: pets.create
      summary: Create a pet
      description: Creates a new pet and returns it with a server-assigned id.
      tags: [pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPet'
      responses:
        '201':
          description: The created pet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid pet payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        description: The pet identifier.
        schema:
          type: string
    get:
      operationId: pets.get
      summary: Get a pet
      description: Returns a single pet by id.
      tags: [pets]
      responses:
        '200':
          description: Pet details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      operationId: pets.delete
      summary: Delete a pet
      description: Deletes a pet by id.
      tags: [pets]
      responses:
        '204':
          description: Deleted.
  /health:
    get:
      operationId: health.get
      summary: Service health
      description: Public liveness check; no authentication required.
      tags: [health]
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token issued for the Petstore Lite API.
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
          description: Server-assigned pet identifier.
        name:
          type: string
          description: Pet name.
        tag:
          type: string
          description: Optional classification tag.
    NewPet:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Pet name.
        tag:
          type: string
          description: Optional classification tag.
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable error message.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
          description: Liveness status.
security:
  - bearerAuth: []
  - {}
