version: 1

tenants:
  - id: acme
    name: Acme
  - id: globex
    name: Globex

principals:
  - id: acme-automation
    tenantId: acme
    allowedConnectionIds:
      - acme-petstore-prod
      - acme-billing-prod
      - acme-petstore-public
      - acme-petstore-partner
  - id: globex-automation
    tenantId: globex
    allowedConnectionIds:
      - globex-petstore-prod
      - globex-billing-prod
      - globex-petstore-basic

backends:
  - id: petstore
    title: Petstore Lite API
    scope: global
    catalogRef: ./apis/petstore.catalog.json
    catalogChecksum: sha256:7d41ead49443b3bf2865304e0a455fa74baef7efadf307ee075ff52a105bb191
  - id: billing
    title: Billing API
    scope: global
    catalogRef: ./sample-catalog.json
    catalogChecksum: sha256:6d58295e29802224dad1624bb8b4c1e22c45433d32f91c69216c76ff5d87ed0d

connections:
  - id: acme-petstore-prod
    tenantId: acme
    backendId: petstore
    baseUrl: https://example.com
    auth:
      type: bearer
      tokenRef: env:ACME_PETSTORE_TOKEN
  - id: acme-billing-prod
    tenantId: acme
    backendId: billing
    baseUrl: https://example.com
    auth:
      type: apiKey
      in: header
      name: X-API-Key
      valueRef: env:ACME_BILLING_API_KEY
    policy:
      disabledOperations:
        - invoice.delete
      confirmation: always
      timeoutMs: 5000
      maxRequestBytes: 262144
      maxResponseBytes: 10485760
      maxConcurrency: 2
      rateLimitPerMinute: 120
      allowedContentTypes:
        - application/json
  - id: acme-petstore-public
    tenantId: acme
    backendId: petstore
    baseUrl: https://example.com
    auth:
      type: none
  - id: acme-petstore-partner
    tenantId: acme
    backendId: petstore
    baseUrl: https://example.com
    auth:
      type: staticHeaders
      headers:
        X-Partner-Key: env:ACME_PETSTORE_PARTNER_KEY
  - id: globex-petstore-prod
    tenantId: globex
    backendId: petstore
    baseUrl: https://example.com
    auth:
      type: bearer
      tokenRef: env:GLOBEX_PETSTORE_TOKEN
  - id: globex-billing-prod
    tenantId: globex
    backendId: billing
    baseUrl: https://example.com
    auth:
      type: apiKey
      in: query
      name: api_key
      valueRef: env:GLOBEX_BILLING_API_KEY
  - id: globex-petstore-basic
    tenantId: globex
    backendId: petstore
    baseUrl: https://example.com
    auth:
      type: basic
      usernameRef: env:GLOBEX_PETSTORE_USERNAME
      passwordRef: env:GLOBEX_PETSTORE_PASSWORD
