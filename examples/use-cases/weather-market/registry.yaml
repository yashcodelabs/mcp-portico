version: 1

tenants:
  - id: local-research
    name: Local Research

principals:
  - id: local-research-agent
    tenantId: local-research
    allowedConnectionIds:
      - weather
      - crypto-market
      - fx

backends:
  - id: weather
    title: Open-Meteo Forecast API
    scope: global
    catalogRef: ./apis/open-meteo.catalog.json
    catalogChecksum: sha256:d7956ea0867e16865d00ee0e666aef39d3623f701ce66321be89c5e323dc0c4d
  - id: crypto-market
    title: CoinGecko Simple Price API
    scope: global
    catalogRef: ./apis/coingecko.catalog.json
    catalogChecksum: sha256:086765d0821344ceb936e1ca92966b999d97f272258cce738dc59e82e5366bd8
  - id: fx
    title: Frankfurter Exchange Rates API
    scope: global
    catalogRef: ./apis/frankfurter.catalog.json
    catalogChecksum: sha256:0523160ffb96a1f5004b86a44f4a8e1386d538f40d35c2e98dcdd6416743d286

connections:
  - id: weather
    tenantId: local-research
    backendId: weather
    baseUrl: https://api.open-meteo.com
    network:
      allowedProtocols: [https]
    auth:
      type: none
  - id: crypto-market
    tenantId: local-research
    backendId: crypto-market
    baseUrl: https://api.coingecko.com
    network:
      allowedProtocols: [https]
    auth:
      type: none
  - id: fx
    tenantId: local-research
    backendId: fx
    baseUrl: https://api.frankfurter.dev
    network:
      allowedProtocols: [https]
    auth:
      type: none
