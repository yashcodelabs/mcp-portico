openapi: 3.0.3
info:
  title: Frankfurter Exchange Rates API
  description: >-
    Public ECB reference exchange rates used to normalize the market context
    into a requested quote currency.
  version: 1.0.0
tags:
  - name: fx
    description: Exchange-rate operations
paths:
  /v1/latest:
    get:
      operationId: fx.latest
      summary: Get the latest exchange rates
      description: Return the latest reference rates for a base currency.
      tags: [fx]
      parameters:
        - name: base
          in: query
          required: false
          description: Base currency code.
          schema:
            type: string
            default: EUR
        - name: symbols
          in: query
          required: false
          description: Comma-separated target currency codes.
          schema:
            type: string
            default: USD
      responses:
        '200':
          description: Latest reference rates.
          content:
            application/json:
              schema:
                type: object
                required: [amount, base, date, rates]
                properties:
                  amount:
                    type: number
                  base:
                    type: string
                  date:
                    type: string
                  rates:
                    type: object
                    additionalProperties:
                      type: number
