openapi: 3.0.3
info:
  title: CoinGecko Simple Price API
  description: >-
    Public crypto-market prices used by the weather-market research use case.
    Values are informational market data, not investment advice.
  version: 1.0.0
tags:
  - name: market
    description: Market price operations
paths:
  /api/v3/simple/price:
    get:
      operationId: market.simple_price
      summary: Get current crypto prices
      description: Return current prices and 24-hour changes for selected assets.
      tags: [market]
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated CoinGecko asset ids.
          schema:
            type: string
            default: bitcoin,ethereum
        - name: vs_currencies
          in: query
          required: true
          description: Comma-separated quote currencies.
          schema:
            type: string
            default: usd
        - name: include_24hr_change
          in: query
          required: false
          description: Include the 24-hour percentage change.
          schema:
            type: boolean
            default: true
        - name: include_market_cap
          in: query
          required: false
          description: Include market capitalization in the quote currency.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: Current prices keyed by asset id.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: object
                  additionalProperties: true
