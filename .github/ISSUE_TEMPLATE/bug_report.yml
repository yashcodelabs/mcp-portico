name: Bug report
description: Report a reproducible defect in MCP Portico.
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, customer data, or private backend URLs.
        Suspected vulnerabilities belong in the private security-advisory flow.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction, commands, or fixture.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MCP Portico version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Node.js 22, pnpm 11, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste redacted logs or errors. Remove credentials and private data.
      render: text
