name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit:deps
      - name: Format check
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Interop contract tests
        run: pnpm vitest run test/integration/mcp-contract.test.ts
      - name: Fixture validation
        run: pnpm test:fixtures
      - name: Brand audit
        run: pnpm sweep:brand
      - name: Secret audit
        run: pnpm sweep:secrets
      - name: Build
        run: pnpm build
      - name: Docs walkthrough (clean checkout)
        run: |
          set -euo pipefail
          walk="$RUNNER_TEMP/portico-walkthrough"
          rm -rf "$walk"
          mkdir -p "$walk"
          cp -R examples/. "$walk/"
          node dist/cli/index.js catalog import "$walk/apis/petstore.openapi.yaml" \
            --api-id petstore \
            --output "$walk/apis/petstore.catalog.json" \
            --report "$walk/petstore.report.json"
          node dist/cli/index.js catalog validate "$walk/apis/petstore.catalog.json"
          node dist/cli/index.js catalog diff examples/apis/petstore.catalog.json "$walk/apis/petstore.catalog.json"
          node dist/cli/index.js catalog diff "$walk/apis/petstore.catalog.json" "$walk/apis/petstore.catalog.json"
          node dist/cli/index.js registry validate "$walk/sample-registry.yaml"
          MCP_PORTICO_KEY_PEPPER='walkthrough-pepper' node dist/cli/index.js key create \
            --registry "$walk/sample-registry.yaml" --tenant acme --principal acme-automation >/dev/null
          MCP_PORTICO_KEY_PEPPER='walkthrough-pepper' node dist/cli/index.js key create \
            --registry "$walk/sample-registry.yaml" --tenant globex --principal globex-automation >/dev/null
          MCP_PORTICO_KEY_PEPPER='walkthrough-pepper' node dist/cli/index.js registry validate "$walk/sample-registry.yaml"
      - name: CLI smoke test
        run: pnpm smoke
      - name: Package, license, and docs audit
        run: pnpm test:pack

  windows-compat:
    name: windows compatibility (node 22)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.9.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Dependency audit
        run: pnpm audit:deps
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:integration
      - name: Fixture validation
        run: pnpm test:fixtures
      - name: Brand audit
        run: pnpm sweep:brand
      - name: Secret audit
        run: pnpm sweep:secrets
      - name: Build
        run: pnpm build
      - name: Package, license, and docs audit
        run: pnpm test:pack
